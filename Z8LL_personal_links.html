<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <meta name="description" content="Z8LL — Official links and social profiles. SNI TEAM.">
  <title>Z8LL | Official Links</title>
  <style>
    :root {
      --bg: #080812;
      --panel: rgba(20, 20, 40, .78);
      --text: #f7f7ff;
      --muted: #aaaac2;
      --cyan: #00f5ff;
      --pink: #ff2bd6;
      --purple: #8b5cff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 34px 16px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(0,245,255,.13), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255,43,214,.13), transparent 32%),
        var(--bg);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    .card {
      width: min(100%, 440px);
      position: relative;
      padding: 34px 26px 25px;
      text-align: center;
      border: 1px solid rgba(0,245,255,.42);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 22px rgba(0,245,255,.12), 0 0 55px rgba(255,43,214,.09);
      animation: appear .8s ease both;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(135deg, var(--cyan), transparent 38%, var(--pink), var(--purple));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .profile-poster {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      margin: 0 auto 22px;
      border-radius: 19px;
      border: 1px solid rgba(183, 80, 255, .75);
      box-shadow: 0 0 20px rgba(139, 92, 255, .38), 0 0 38px rgba(255, 43, 214, .18);
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #080812;
      background: linear-gradient(135deg, var(--cyan), #fff 48%, var(--pink));
      box-shadow: 0 0 18px rgba(0,245,255,.6), 0 0 35px rgba(255,43,214,.25);
      border: 3px solid rgba(255,255,255,.85);
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 10vw, 48px);
      letter-spacing: 5px;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(0,245,255,.7), 0 0 22px rgba(255,43,214,.5);
    }
    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .team {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 25px;
      padding: 8px 15px;
      border: 1px solid rgba(255,43,214,.55);
      border-radius: 999px;
      color: #ffd8fa;
      background: rgba(255,43,214,.08);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255,43,214,.12);
    }
    .team-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 9px var(--pink);
    }
    .links { display: grid; gap: 13px; }
    .link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      padding: 13px 17px;
      color: var(--text);
      text-decoration: none;
      text-align: left;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
      overflow: hidden;
    }
    .link::after {
      content: "↗";
      margin-left: auto;
      color: var(--cyan);
      font-size: 20px;
      transition: transform .22s ease;
    }
    .link:hover {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--cyan);
      background: rgba(0,245,255,.075);
      box-shadow: 0 0 17px rgba(0,245,255,.16);
    }
    .link:hover::after { transform: translate(3px,-3px); }
    .icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      border-radius: 10px;
      color: var(--cyan);
      background: rgba(0,245,255,.1);
      font-size: 18px;
      font-weight: 900;
    }
    .link:nth-child(even) .icon {
      color: var(--pink);
      background: rgba(255,43,214,.1);
    }
    .link-label { font-weight: 700; font-size: 15px; }
    .link-handle { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    footer { margin-top: 28px; color: #77778f; font-size: 11px; letter-spacing: 2px; }
    footer strong { color: var(--pink); }
    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 380px) {
      .card { padding: 28px 18px 22px; }
      .link { min-height: 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
